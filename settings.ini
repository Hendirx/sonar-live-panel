# Sonar Live Panel settings. Restart the panel after editing.

# loopMIDI port names (must match what you typed in loopMIDI).
# InPort  = the port Sonar's Mackie Control sends OUT on
# OutPort = the port Sonar's Mackie Control listens IN on
InPort=From Sonar
OutPort=To Sonar

# Start with the hotkeys active (the Scroll Lock key toggles them).
StartLive=true
AlwaysOnTop=true
# Dock as a bar along the bottom of the screen (maximized windows stop above it).
# false = a normal window you can move and resize.
DockBottom=true

# How far one press of volume up/down moves the fader (0.02 = 2% of its travel).
VolumeStep=0.02
# How many pan "clicks" one press of pan left/right sends (1-15).
PanTicks=1

# Set to true if the track names show up in the small text instead of the big text.
NamesOnBottomRow=false

# Fallback if picking a track doesn't move your keyboard to it: also record-arms the
# picked track and disarms the others in view (relies on input echo of armed tracks).
ArmOnSelect=false

# Writes every Mackie message to debug-log.txt next to the .exe (for troubleshooting).
Debug=false

# Hotkeys. Comma-separate alternatives; names are .NET "Keys" names, e.g. D1 = the 1 key,
# NumPad1, F13, Up, PageUp, OemMinus, Oemplus, OemOpenBrackets. Prefix Ctrl+ / Alt+ / Shift+.
ToggleLive=Scroll
Select1=D1,NumPad1
Select2=D2,NumPad2
Select3=D3,NumPad3
Select4=D4,NumPad4
Select5=D5,NumPad5
Select6=D6,NumPad6
Select7=D7,NumPad7
Select8=D8,NumPad8
PrevTrack=Up
NextTrack=Down
PrevBank=PageUp
NextBank=PageDown
VolDown=OemMinus,Subtract
VolUp=Oemplus,Add
PanLeft=Left,OemOpenBrackets
PanRight=Right,OemCloseBrackets
# Volume of the pinned (always-on) track.
PinVolDown=Shift+OemMinus,Shift+Subtract
PinVolUp=Shift+Oemplus,Shift+Add
